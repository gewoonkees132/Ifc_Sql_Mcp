# Install once with `make install` (runs `pre-commit install`).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The audit's evidence is recorded output (tool calls, transcripts, readings), kept
      # byte for byte as it was written, so the whitespace fixers leave it alone.
      - id: trailing-whitespace
        exclude: ^docs/audit/evidence/
      - id: end-of-file-fixer
        exclude: ^docs/audit/evidence/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      # Keeps sample IFC files (MBs) out of git; the synthetic fixture is far smaller.
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5  # keep in step with the ruff version in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy runs from the project environment so it sees the same dependencies and config
  # as `make typecheck`, instead of a separately pinned copy inside pre-commit.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
