[project]
name = "ifc-sql-mcp"
version = "0.1.0"
description = "Load Revit-exported IFC files into a normalised PostgreSQL model and expose it to LLMs over MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20,<2",
    "ifcopenshell>=0.9.0.post1,<0.10",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "typer>=0.16",
]

[project.scripts]
ifc-sql = "ifc_sql_mcp.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

# --------------------------------------------------------------------------- alembic
# For the plain `alembic` CLI (history, new revisions). `make migrate` / `ifc-sql migrate`
# build the same configuration in code; the database URL always comes from IFC_SQL_*.
[tool.alembic]
script_location = "%(here)s/src/ifc_sql_mcp/db/migrations"

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "SIM",     # simplify
    "C4",      # comprehensions
    "RUF",     # ruff-specific
    "S",       # bandit (security)
    "PT",      # pytest style
    "DTZ",     # timezone-aware datetimes only
    "PTH",     # pathlib over os.path
    "ERA",     # no commented-out code
    "T20",     # no stray print()
    "D",       # docstrings
]
ignore = [
    "D105",  # magic methods document themselves
    "D107",  # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D"]  # asserts, fake test passwords; names are the docs
"scripts/**" = ["T201"]      # scripts talk to the user with print()

[tool.ruff.lint.isort]
known-first-party = ["ifc_sql_mcp"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
strict = true
warn_unreachable = true

# IfcOpenShell ships partial type hints: entity attributes are resolved at run time, and
# some signatures are narrower than the values they accept. Treat it as untyped, and only
# here: ingest/extract.py is the one module that imports it, and it converts every value
# it reads into a checked type, so everything downstream stays strictly typed.
[[tool.mypy.overrides]]
module = ["ifcopenshell", "ifcopenshell.*"]
follow_imports = "skip"

# --------------------------------------------------------------------------- pytest
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
# None of these folders is a package; this lets tests `import download_samples`, the
# fixture generator (`make_revit_quirks`) and shared helpers (`record_contract`).
pythonpath = ["scripts", "tests/fixtures", "tests/support"]
strict = true
addopts = ["-ra", "-m", "not sample"]
markers = [
    "sample: downloads the real Duplex files over the network (deselected by default; run with -m sample)",
]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- coverage
[tool.coverage.run]
# A path, not the package name: Alembic loads env.py and the migration scripts by file
# path under its own module names, and they should be measured too.
source = ["src/ifc_sql_mcp"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
]
