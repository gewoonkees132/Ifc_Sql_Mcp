<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ifc-sql view</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/viewer.css">
<!-- The page's one inline script. The server allows it by its SHA-256 (ADR 14, decision 3). -->
<script type="importmap">
{
  "imports": {
    "three": "/static/vendor/three/three.module.js",
    "three/addons/": "/static/vendor/three/addons/"
  }
}
</script>
<script type="module" src="/static/main.js"></script>
</head>
<body>
<aside class="sidebar" aria-label="What is shown">
  <header class="brand">
    <h1>ifc-sql view</h1>
    <p class="muted">The loaded models, read-only, on this computer.</p>
  </header>

  <section class="panel">
    <label class="panel-title" for="project">Project</label>
    <select id="project" disabled></select>
  </section>

  <section class="panel">
    <h2 class="panel-title">Models</h2>
    <ul id="models" class="model-list"></ul>
  </section>

  <section class="panel">
    <h2 class="panel-title">Disciplines</h2>
    <div id="disciplines" class="chips"></div>
  </section>

  <section class="panel">
    <h2 class="panel-title">Storeys <button id="all-storeys" class="link" type="button" hidden>show all</button></h2>
    <ul id="storeys" class="storey-list"></ul>
  </section>

  <section class="panel">
    <h2 class="panel-title">Layers</h2>
    <label class="check"><input type="checkbox" id="spaces"> Rooms (IfcSpace)</label>
  </section>

  <footer id="status" class="status" role="status">Starting…</footer>
</aside>

<main class="stage">
  <div id="canvas" class="canvas"></div>
  <div id="caption" class="caption" hidden></div>
  <div class="toolbar" role="toolbar" aria-label="View">
    <button id="fit" type="button">fit</button>
    <button id="fit-selection" type="button" disabled>fit selection</button>
    <button id="only-selection" type="button" aria-pressed="false" disabled>only selection</button>
  </div>
  <div id="message" class="message" role="alert" hidden></div>
</main>

<aside id="drawer" class="drawer" aria-label="Element details" hidden>
  <header class="drawer-head">
    <div id="drawer-title" class="drawer-title"></div>
    <button id="drawer-close" class="close" type="button" aria-label="Close the details">×</button>
  </header>
  <div id="drawer-body" class="drawer-body"></div>
</aside>
</body>
</html>
